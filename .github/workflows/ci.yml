name: CI

on:
  push:
    branches: [dev, master, main]
  pull_request:
    branches: [dev, master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # 1. Contracts Check (Soroban / Rust)
  # ===========================================================================
  contracts:
    name: Contracts (Format, Lint, Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts -> target

      - name: Format Check (cargo fmt --check)
        working-directory: contracts
        run: cargo fmt --all -- --check

      - name: Linting (cargo clippy)
        working-directory: contracts
        run: cargo clippy --all-targets -- -D warnings

      - name: Type-Check & Unit Tests (cargo test)
        working-directory: contracts
        run: cargo test

  # ===========================================================================
  # 2. Backend Check (Node.js & Prisma)
  # ===========================================================================
  backend:
    name: Backend (Format, Lint, Type-Check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: backend
        run: pnpm install --config.dangerously-allow-all-builds=true

      - name: Format Check (prettier --check)
        working-directory: backend
        run: pnpm run format:check

      - name: Lint & Type-Check (tsc --noEmit)
        working-directory: backend
        run: pnpm run lint

      - name: Build Verification (tsc)
        working-directory: backend
        run: pnpm run build

  # ===========================================================================
  # 3. Frontend Check (React 19 & Vite)
  # ===========================================================================
  frontend:
    name: Frontend (Format, Lint, Type-Check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --config.dangerously-allow-all-builds=true

      - name: Format Check (prettier --check)
        working-directory: frontend
        run: pnpm run format:check

      - name: Linting (eslint)
        working-directory: frontend
        run: pnpm run lint

      - name: Type-Check (tsc -b)
        working-directory: frontend
        run: pnpm run typecheck

      - name: Build Verification (vite build)
        working-directory: frontend
        run: pnpm run build
